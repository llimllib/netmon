# Grafana's config on qfwfq. deploy/qfwfq.sh copies it to
# /opt/homebrew/etc/grafana/grafana.ini, which `brew services` runs Grafana
# with. Anything not set here comes from Grafana's defaults.ini.

[paths]
provisioning = /Users/llimllib/netmon/grafana/provisioning

[server]
http_port = 3000

# Anyone on the home network can view dashboards without logging in
[auth.anonymous]
enabled = true
org_role = Viewer

[plugins]
# Not in Grafana's catalog, so it's unsigned; deploy/qfwfq.sh installs it
allow_loading_unsigned_plugins = motherduck-duckdb-datasource

[analytics]
reporting_enabled = false
